<text x="560.0" y="60.0" fill="#222222" font-size="13" text-anchor="middle">pass 1: render depth from the light</text>
<text x="560.0" y="80.0" fill="#222222" font-size="13" text-anchor="middle">into a texture (the shadow map)</text>
<text x="560.0" y="110.0" fill="#222222" font-size="13" text-anchor="middle">pass 2: for each visible point,</text>
<text x="560.0" y="130.0" fill="#222222" font-size="13" text-anchor="middle">compare its distance to the light</text>
<text x="560.0" y="150.0" fill="#222222" font-size="13" text-anchor="middle">with the shadow map's value</text>
