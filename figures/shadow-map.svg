<line x1="330.0" y1="170.0" x2="480.0" y2="250.0" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="120.0" y1="50.0" x2="620.0" y2="250.0" stroke="#e08a1e" stroke-width="1.4"/>
<circle cx="330.0" cy="170.0" r="4.5" stroke="#2f6fdd" fill="#2f6fdd" stroke-width="1"/>
<text x="338.0" y="162.0" fill="#2f6fdd" font-size="12" text-anchor="start">A: nearest to the light</text>
<circle cx="480.0" cy="250.0" r="5" stroke="#d9503f" fill="#d9503f" stroke-width="1"/>
<text x="480.0" y="272.0" fill="#d9503f" font-size="12" text-anchor="middle">P: farther than the stored depth → in shadow</text>
<circle cx="620.0" cy="250.0" r="5" stroke="#2e9a4f" fill="#2e9a4f" stroke-width="1"/>
