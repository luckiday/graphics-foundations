<rect width="760" height="300" fill="#ffffff"/>
<circle cx="120.0" cy="50.0" r="12" stroke="#e08a1e" fill="#fff4d6" stroke-width="2"/>
<text x="120.0" y="30.0" fill="#e08a1e" font-size="13" text-anchor="middle">light</text>
<line x1="40.0" y1="250.0" x2="720.0" y2="250.0" stroke="#222222" stroke-width="2"/>
<rect x="240.0" y="170.0" width="90.0" height="80.0" rx="2" stroke="#222222" fill="#e3ecfb" stroke-width="1.6"/>
