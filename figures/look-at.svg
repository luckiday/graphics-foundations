<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" font-family="Helvetica, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="The camera basis built by look_at">
<title>The camera basis built by look_at</title><defs><marker id="m222222" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="m6b6b70" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b70"/></marker><marker id="m2f6fdd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdd"/></marker><marker id="md9503f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9503f"/></marker><marker id="m2e9a4f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9a4f"/></marker><marker id="me08a1e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker><marker id="m8a4fc7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fc7"/></marker></defs>
<rect width="620" height="330" fill="#ffffff"/>
<line x1="150.0" y1="230.0" x2="470.0" y2="120.0" stroke="#6b6b70" stroke-width="1.4" stroke-dasharray="6 5"/>
<circle cx="150.0" cy="230.0" r="5" stroke="#222222" fill="#222222" stroke-width="1"/>
<text x="166.0" y="250.0" fill="#222222" font-size="14" text-anchor="start">eye</text>
<circle cx="470.0" cy="120.0" r="5" stroke="#222222" fill="#222222" stroke-width="1"/>
<text x="480.0" y="110.0" fill="#222222" font-size="14" text-anchor="start">at</text>
<line x1="150.0" y1="230.0" x2="74.3" y2="256.0" stroke="#2f6fdd" stroke-width="2.4" marker-end="url(#m2f6fdd)"/>
<text x="62.3" y="272.0" fill="#2f6fdd" font-size="17" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">n</text>
<line x1="150.0" y1="230.0" x2="124.0" y2="154.3" stroke="#2e9a4f" stroke-width="2.4" marker-end="url(#m2e9a4f)"/>
<text x="112.0" y="148.3" fill="#2e9a4f" font-size="17" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">v</text>
<line x1="150.0" y1="230.0" x2="128.0" y2="288.0" stroke="#d9503f" stroke-width="2.4" marker-end="url(#md9503f)"/>
<text x="116.0" y="296.0" fill="#d9503f" font-size="17" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">u</text>
<text x="80.0" y="322.0" fill="#d9503f" font-size="11" text-anchor="middle">(toward the viewer)</text>
<line x1="60.0" y1="100.0" x2="60.0" y2="30.0" stroke="#e08a1e" stroke-width="2" marker-end="url(#me08a1e)"/>
<text x="72.0" y="40.0" fill="#e08a1e" font-size="13" text-anchor="start">up (world hint)</text>
<text x="430.0" y="215.0" fill="#2f6fdd" font-size="14" text-anchor="start">n = normalize(eye − at)</text>
<text x="430.0" y="238.0" fill="#d9503f" font-size="14" text-anchor="start">u = normalize(up × n)</text>
<text x="430.0" y="261.0" fill="#2e9a4f" font-size="14" text-anchor="start">v = n × u</text>
<text x="430.0" y="292.0" fill="#6b6b70" font-size="13" text-anchor="start">the camera looks along −n</text>
</svg>
